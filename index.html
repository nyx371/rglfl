<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101418">
<title>GRIDFORGE</title>
<link rel="stylesheet" href="style.css?v=20260808142352">
</head>
<body>
<canvas id="game"></canvas>

<div id="topbar">
  <div id="topbar-row">
    <button id="offline-jump" class="chip hidden"><span class="chip-icon" data-icon="warn"></span><span id="offline-count"></span></button>
  </div>
  <div id="inv-strip"></div>
</div>

<div id="bottombar">
  <button class="tab" data-panel="build"><span class="tab-icon" data-icon="hammer"></span><span>Build</span></button>
  <button class="tab" data-panel="tech"><span class="tab-icon" data-icon="processor"></span><span>Tech</span></button>
  <button class="tab" data-panel="perks"><span class="tab-icon" data-icon="upgrade"></span><span>Perks</span></button>
  <button class="tab" data-panel="inv"><span class="tab-icon" data-icon="crate"></span><span>Resources</span></button>
  <button class="tab" data-panel="menu"><span class="tab-icon" data-icon="menu"></span><span>Menu</span></button>
</div>

<div id="placebar" class="hidden">
  <button id="paint-hold"><span class="chip-icon" data-icon="hammer"></span></button>
  <span id="placebar-label"></span>
  <button id="placebar-cancel">Done</button>
</div>

<div id="sheet" class="hidden">
  <div id="sheet-head"><span id="sheet-title"></span><div id="sheet-actions"></div><button id="sheet-close">&times;</button></div>
  <div id="sheet-body"></div>
</div>

<div id="radial" class="hidden"></div>

<div id="modal-wrap" class="hidden">
  <div id="modal"></div>
</div>

<div id="toasts"></div>

<script src="js/icons.js?v=20260808142352"></script>
<script src="js/data.js?v=20260808142352"></script>
<script src="js/game.js?v=20260808142352"></script>
</body>
</html>
